<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0" />
    </radialGradient>

    <!-- Cloud Front Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Smooth Shadow for Cloud Base -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow for Sun -->
    <filter id="sunBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Squircle Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Sun Glow aura -->
  <circle cx="215" cy="205" r="110" fill="url(#sunGlow)" />

  <!-- Sun Rays -->
  <g stroke="url(#sunGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="215" y1="75" x2="215" y2="45" />
    <line x1="123" y1="113" x2="101" y2="91" />
    <line x1="85" y1="205" x2="55" y2="205" />
    <line x1="307" y1="113" x2="329" y2="91" />
    <line x1="345" y1="205" x2="375" y2="205" />
  </g>

  <!-- Sun Core -->
  <circle cx="215" cy="205" r="70" fill="url(#sunGrad)" filter="url(#dropShadow)" />

  <!-- Rain Drops -->
  <g fill="url(#rainGrad)">
    <path d="M 210,380 C 210,380 200,398 200,408 C 200,413.5 204.5,418 210,418 C 215.5,418 220,413.5 220,408 C 220,398 210,380 210,380 Z" opacity="0.9" />
    <path d="M 275,395 C 275,395 265,413 265,423 C 265,428.5 269.5,433 275,433 C 280.5,433 285,428.5 285,423 C 285,413 275,395 275,395 Z" opacity="0.9" />
    <path d="M 340,380 C 340,380 330,398 330,408 C 330,413.5 334.5,418 340,418 C 345.5,418 350,413.5 350,408 C 350,398 340,380 340,380 Z" opacity="0.9" />
  </g>

  <!-- Front Cloud -->
  <path d="
    M 210,360
    L 375,360
    A 45,45 0 0,0 375,270
    A 40,40 0 0,0 338,235
    A 65,65 0 0,0 215,245
    A 50,50 0 0,0 160,310
    A 50,50 0 0,0 210,360
    Z"
    fill="url(#cloudGrad)"
    filter="url(#dropShadow)" />
</svg>
